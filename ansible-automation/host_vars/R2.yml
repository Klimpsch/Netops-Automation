---
device_type: router

loopback:
  name: Loopback0
  ip: 10.0.0.2
  mask: 255.255.255.255

interfaces:
  - name: GigabitEthernet1
    mode: routed
    ip: 10.1.1.2
    mask: 255.255.255.252
    ospf: { process: 1, area: 0 }
  - name: GigabitEthernet2
    mode: routed
    ip: 10.1.1.9
    mask: 255.255.255.252
    ospf: { process: 1, area: 0 }
  - name: GigabitEthernet3
    mode: routed
    ip: 10.1.1.14
    mask: 255.255.255.252
    ospf: { process: 1, area: 0 }
  - name: GigabitEthernet4
    mode: routed
    ip: 10.1.1.17
    mask: 255.255.255.252
    ospf: { process: 1, area: 0 }

ospf:
  process: 1
  router_id: 10.0.0.2
  passive_default: true
  active_interfaces:
    - GigabitEthernet1
    - GigabitEthernet2
    - GigabitEthernet3
    - GigabitEthernet4
  networks:
    - { address: 10.0.0.0, wildcard: 0.0.0.255, area: 0 }
