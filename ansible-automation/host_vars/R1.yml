---
device_type: router

loopback:
  name: Loopback0
  ip: 10.0.0.1
  mask: 255.255.255.255

interfaces:
  - name: GigabitEthernet1
    mode: routed
    ip: 10.1.1.1
    mask: 255.255.255.252
    ospf: { process: 1, area: 0 }
  - name: GigabitEthernet2
    mode: routed
    ip: 10.1.1.5
    mask: 255.255.255.252
    ospf: { process: 1, area: 0 }
  - name: GigabitEthernet3
    mode: unused
  - name: GigabitEthernet4
    mode: unused

ospf:
  process: 1
  router_id: 10.0.0.1
  passive_default: true
  active_interfaces:
    - GigabitEthernet1
    - GigabitEthernet2
    - GigabitEthernet3
  networks:
    - { address: 10.0.0.0, wildcard: 0.0.0.255, area: 0 }
