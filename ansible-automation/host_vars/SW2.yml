---
device_type: switch

loopback:
  name: Loopback0
  ip: 10.0.0.5
  mask: 255.255.255.255

vlans:
  - id: 99
    name: MGMT

interfaces:
  - name: GigabitEthernet0/1
    mode: routed           # 'no switchport' + L3 address
    ip: 10.1.1.26
    mask: 255.255.255.252
    ospf: { process: 1, area: 0 }
  - name: GigabitEthernet0/2
    mode: routed           # 'no switchport' + L3 address
    ip: 10.1.1.18
    mask: 255.255.255.252
    ospf: { process: 1, area: 0 }

svis:
  - name: Vlan99
    description: MGMT-SVI
    ip: 192.168.99.3
    mask: 255.255.255.0

ospf:
  process: 1
  router_id: 10.0.0.5
  passive_default: true
  active_interfaces:
    - GigabitEthernet0/0
    - GigabitEthernet0/1
    - GigabitEthernet0/2
  networks:
    - { address: 10.0.0.0,     wildcard: 0.0.0.255, area: 0 }
    - { address: 10.1.1.0,     wildcard: 0.0.0.255, area: 0 }
    - { address: 192.168.99.0, wildcard: 0.0.0.255, area: 0 }

